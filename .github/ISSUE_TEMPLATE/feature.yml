name: Feature request
description: Propose a focused improvement
labels:
  - enhancement
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Problem and workload that need the change.
    validations:
      required: true
  - type: textarea
    id: requested-outcome
    attributes:
      label: Requested outcome
      description: Desired behavior, without prescribing an implementation.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version and operating system
      description: Current version and OS when relevant.
      placeholder: v0.1.1-alpha on Linux amd64, or not applicable
    validations:
      required: true
  - type: input
    id: benchmark-artifact
    attributes:
      label: Benchmark artifact
      description: For performance requests, link a reproducible artifact; otherwise write "not applicable".
      placeholder: https://github.com/.../actions/runs/... or not applicable
    validations:
      required: true
