name: Bug report
description: Report reproducible incorrect behavior
labels:
  - bug
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Release version or commit SHA.
      placeholder: v0.1.1-alpha or c7ce194
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      description: OS version and architecture.
      placeholder: Windows 11 24H2, amd64
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal commands, configuration, and steps.
      placeholder: |
        1. Start regiondb with ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected-and-actual
    attributes:
      label: Expected and actual behavior
      description: Include relevant logs without secrets.
    validations:
      required: true
  - type: input
    id: benchmark-artifact
    attributes:
      label: Benchmark artifact
      description: Link an artifact or write "not applicable".
      placeholder: https://github.com/.../actions/runs/... or not applicable
    validations:
      required: true
