name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  style:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: "1.24.x"
          cache: true
          cache-dependency-path: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            os: ubuntu-latest
            test-packages: ./...
          - name: macos
            os: macos-latest
            test-packages: ./...
          - name: windows
            os: windows-latest
            test-packages: ./...
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: "1.24.13"
          cache: true
          cache-dependency-path: go.mod

      - name: Report Go environment
        if: runner.os == 'Windows'
        run: go env

      - name: Vet
        run: go vet ./...

      - name: Test
        if: runner.os != 'Windows'
        run: go test ${{ matrix.test-packages }}

      - name: Test with failure annotations
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go test -json ${{ matrix.test-packages }} |
            Tee-Object -FilePath windows-test-results.json
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) {
            Get-Content windows-test-results.json | ForEach-Object {
              $event = $_ | ConvertFrom-Json
              if ($event.Action -eq "fail" -and $event.Test) {
                $title = $event.Test.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
                $message = "$($event.Package)::$($event.Test)".Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
                Write-Output "::error title=$title::$message"
              }
            }
          }
          exit $testExitCode

      - name: Upload Windows test logs
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-test-logs
          path: windows-test-results.json
          if-no-files-found: warn
          retention-days: 7

      - name: Build
        run: go build ${{ runner.os == 'Windows' && '-v' || '' }} ./...

  race:
    name: race
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: "1.24.x"
          cache: true
          cache-dependency-path: go.mod

      - name: Test with race detector
        run: go test -race ./...
