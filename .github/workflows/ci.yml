name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  style:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: "1.24.x"
          cache: true
          cache-dependency-path: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            os: ubuntu-latest
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: "1.24.13"
          cache: true
          cache-dependency-path: go.mod

      - name: Report Go environment
        if: runner.os == 'Windows'
        # Hosted Windows images can reject this diagnostic platform probe.
        # The quick gate below remains blocking for every build and test error.
        continue-on-error: true
        run: go env

      - name: Run quick gate
        shell: bash
        env:
          REGIONDB_BUILD_VERBOSE: ${{ runner.os == 'Windows' && '1' || '0' }}
          REGIONDB_TEST_JSON_OUTPUT: ${{ runner.os == 'Windows' && 'windows-test-results.json' || '' }}
        run: scripts/test/quick.sh

      - name: Run security regression suite
        if: runner.os == 'Linux'
        run: scripts/test/security.sh

      - name: Repeat server integration tests
        if: runner.os == 'Linux'
        run: go test -run Integration -count=20 ./internal/server

      - name: Annotate Windows test failures
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path windows-test-results.json) {
            Get-Content windows-test-results.json | ForEach-Object {
              $event = $_ | ConvertFrom-Json
              if ($event.Action -eq "fail" -and $event.Test) {
                $title = $event.Test.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
                $message = "$($event.Package)::$($event.Test)".Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
                Write-Output "::error title=$title::$message"
              }
            }
          }

      - name: Upload Windows test logs
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-test-logs
          path: windows-test-results.json
          if-no-files-found: warn
          retention-days: 7

  race:
    name: race
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: "1.24.x"
          cache: true
          cache-dependency-path: go.mod

      - name: Test with race detector
        run: go test -race ./...

  hardened:
    name: fuzz-checkptr
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: "1.24.x"
          cache: true
          cache-dependency-path: go.mod

      - name: Run fuzz and checkptr smoke tests
        run: scripts/test/hardened.sh

  docker:
    name: health-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build --tag regiondb:health-smoke .

      - name: Run container security regressions
        run: scripts/test/container-security.sh regiondb:health-smoke

      - name: Inspect Compose loopback publication
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          binding="$(
            REGIONDB_TOKEN="$token" docker compose config --format json |
              jq -r '.services.regiondb.ports[0].host_ip'
          )"
          test "$binding" = "127.0.0.1"

      - name: Start image and wait for authenticated readiness
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          docker run --detach --name regiondb-health-smoke \
            --env REGIONDB_TOKEN="$token" regiondb:health-smoke
          trap 'docker logs regiondb-health-smoke; docker rm --force regiondb-health-smoke' EXIT
          for attempt in {1..30}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' regiondb-health-smoke)"
            if [[ "$status" == "healthy" ]]; then
              exit 0
            fi
            if [[ "$status" == "unhealthy" ]]; then
              exit 1
            fi
            sleep 1
          done
          exit 1
